<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva tu clase de tenis</title>
<style>
  :root {
    --bg: #f3f0e6;
    --card: #ffffff;
    --verde: #1f6b45;
    --verde-oscuro: #154d31;
    --pelota: #d7e84a;
    --arcilla: #c8643c;
    --texto: #1d2a22;
    --suave: #66756b;
    --borde: #dcd8c9;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--texto);
    line-height: 1.45;
  }
  header {
    background: var(--verde);
    color: #fff;
    padding: 28px 16px 56px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; opacity: .85; }
  .pelota {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: var(--pelota); margin-right: 8px; vertical-align: middle;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.12);
  }
  main { max-width: 560px; margin: -36px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 22px;
    box-shadow: 0 6px 24px rgba(20, 50, 35, .10);
  }
  label, .etiqueta { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  label:first-child, .etiqueta:first-child { margin-top: 0; }
  input[type=text], input[type=tel], input[type=date], textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: inherit;
    border: 1.5px solid var(--borde); border-radius: 10px; background: #fff;
  }
  input:focus, textarea:focus, button:focus-visible {
    outline: 3px solid rgba(31,107,69,.35); outline-offset: 1px; border-color: var(--verde);
  }
  textarea { resize: vertical; min-height: 64px; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .fila { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label {
    margin: 0; padding: 9px 16px; border: 1.5px solid var(--borde); border-radius: 999px;
    cursor: pointer; font-weight: 600; user-select: none; background: #fff;
  }
  .chips input:checked + label { background: var(--verde); border-color: var(--verde); color: #fff; }
  .chips input:focus-visible + label { outline: 3px solid rgba(31,107,69,.35); outline-offset: 1px; }

  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .hora {
    padding: 10px 0; font: inherit; font-weight: 600; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--borde); background: #fff; color: var(--texto);
  }
  .hora:hover:not(:disabled) { border-color: var(--verde); }
  .hora[aria-pressed=true] { background: var(--verde); color: #fff; border-color: var(--verde); }
  .hora:disabled { background: #f0eee6; color: #aaa; text-decoration: line-through; cursor: not-allowed; }
  .ayuda { color: var(--suave); font-size: .85rem; margin: 6px 0 0; }

  .resumen {
    margin-top: 18px; padding: 12px 14px; border-radius: 10px;
    background: #eef6d0; border: 1px solid #d9e79a; font-weight: 600;
  }
  .resumen[hidden], .msg[hidden] { display: none; }
  button.principal {
    width: 100%; margin-top: 18px; padding: 14px; font: inherit; font-weight: 700; font-size: 1.05rem;
    background: var(--verde); color: #fff; border: 0; border-radius: 12px; cursor: pointer;
  }
  button.principal:hover:not(:disabled) { background: var(--verde-oscuro); }
  button.principal:disabled { opacity: .55; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 500; }
  .msg.error { background: #fde9e7; color: var(--error); border: 1px solid #f3c2bd; }
  .msg.ok { background: #e4f4ea; color: var(--verde-oscuro); border: 1px solid #b9dcc6; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding-bottom: 28px; }
  footer a { color: var(--verde); }
</style>
</head>
<body>
<header>
  <h1><span class="pelota"></span>Reserva tu clase de tenis</h1>
  <p>Elige el día, la hora y cuánto tiempo quieres jugar</p>
</header>

<main>
  <form class="card" id="form" novalidate>
    <div class="fila">
      <div>
        <label for="nombre">Tu nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="80" required>
      </div>
      <div>
        <label for="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" maxlength="20" required>
      </div>
    </div>

    <label for="fecha">Día</label>
    <input type="date" id="fecha" name="fecha" required>

    <div class="etiqueta">Duración</div>
    <div class="chips" id="duraciones" role="radiogroup" aria-label="Duración de la clase"></div>

    <div class="etiqueta">Hora de inicio</div>
    <div class="horas" id="horas"></div>
    <p class="ayuda" id="ayudaHoras">Las horas tachadas ya están ocupadas o no alcanzan para la duración elegida.</p>

    <label for="notas">Notas (opcional)</label>
    <textarea id="notas" name="notas" maxlength="300" placeholder="Nivel, objetivo, si llevas raqueta, etc."></textarea>

    <div class="resumen" id="resumen" hidden></div>
    <div class="msg error" id="error" role="alert" hidden></div>
    <div class="msg ok" id="ok" role="status" hidden></div>

    <button type="submit" class="principal" id="enviar" disabled>Reservar clase</button>
  </form>
</main>

<footer>¿Eres el profesor? <a href="/profesor">Ver mi agenda</a></footer>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const estado = { cfg: null, ocupados: [], ahora: null, duracion: 60, hora: null };

  const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const textoDur = (d) => {
    const h = Math.floor(d / 60), m = d % 60;
    return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : '');
  };
  const fechaLarga = (f) => {
    const t = new Date(f + 'T00:00:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  };

  function mostrar(id, texto) {
    ['error', 'ok'].forEach((x) => { $('#' + x).hidden = true; });
    if (id) { const el = $('#' + id); el.textContent = texto; el.hidden = false; }
  }

  async function pedir(url, opts) {
    const r = await fetch(url, opts);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || 'Ocurrió un error. Intenta de nuevo.'); e.status = r.status; throw e; }
    return data;
  }

  function pintarDuraciones() {
    const cont = $('#duraciones');
    cont.innerHTML = '';
    estado.cfg.duraciones.forEach((d) => {
      const id = 'dur' + d;
      const input = document.createElement('input');
      input.type = 'radio'; input.name = 'duracion'; input.id = id; input.value = d;
      input.checked = d === estado.duracion;
      input.addEventListener('change', () => { estado.duracion = d; pintarHoras(); });
      const lab = document.createElement('label');
      lab.htmlFor = id; lab.textContent = textoDur(d);
      cont.append(input, lab);
    });
  }

  function disponible(inicio) {
    const { cfg, ocupados, ahora, duracion } = estado;
    const fin = inicio + duracion;
    if (fin > cfg.cierre * 60) return false;
    if ($('#fecha').value === ahora.fecha && inicio <= ahora.minutos) return false;
    return !ocupados.some((o) => o.inicio < fin && o.fin > inicio);
  }

  function pintarHoras() {
    const cont = $('#horas');
    cont.innerHTML = '';
    const { cfg } = estado;
    let hayAlguna = false;
    for (let m = cfg.apertura * 60; m + cfg.paso <= cfg.cierre * 60; m += cfg.paso) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'hora'; b.textContent = hhmm(m);
      const ok = disponible(m);
      b.disabled = !ok;
      if (ok) hayAlguna = true;
      const sel = estado.hora === m && ok;
      b.setAttribute('aria-pressed', sel ? 'true' : 'false');
      b.addEventListener('click', () => { estado.hora = m; pintarHoras(); });
      cont.appendChild(b);
    }
    if (estado.hora !== null && !disponible(estado.hora)) estado.hora = null;
    $('#ayudaHoras').textContent = hayAlguna
      ? 'Las horas tachadas ya están ocupadas o no alcanzan para la duración elegida.'
      : 'No quedan horarios para este día con esa duración. Prueba otro día o una clase más corta.';
    actualizarResumen();
  }

  function actualizarResumen() {
    const r = $('#resumen');
    if (estado.hora === null || !$('#fecha').value) {
      r.hidden = true;
      $('#enviar').disabled = true;
      return;
    }
    r.textContent = `${fechaLarga($('#fecha').value)} · ${hhmm(estado.hora)} a ${hhmm(estado.hora + estado.duracion)} (${textoDur(estado.duracion)})`;
    r.hidden = false;
    $('#enviar').disabled = false;
  }

  async function cargarDisponibilidad() {
    const fecha = $('#fecha').value;
    if (!fecha) return;
    try {
      const d = await pedir('/api/disponibilidad?fecha=' + encodeURIComponent(fecha));
      estado.ocupados = d.ocupados;
      estado.ahora = d.ahora;
    } catch (e) {
      mostrar('error', e.message);
    }
    pintarHoras();
  }

  $('#fecha').addEventListener('change', () => { estado.hora = null; mostrar(null); cargarDisponibilidad(); });

  $('#form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    mostrar(null);
    const nombre = $('#nombre').value.trim();
    const telefono = $('#telefono').value.trim();
    if (nombre.length < 2) return mostrar('error', 'Escribe tu nombre.');
    if (!/^[0-9+()\-\s]{7,20}$/.test(telefono)) return mostrar('error', 'Escribe un teléfono válido (solo números).');
    if (estado.hora === null) return mostrar('error', 'Elige una hora.');

    const btn = $('#enviar');
    btn.disabled = true; btn.textContent = 'Reservando…';
    const fecha = $('#fecha').value;
    const hora = hhmm(estado.hora);
    try {
      const r = await pedir('/api/reservas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, telefono, fecha, hora, duracion: estado.duracion, notas: $('#notas').value }),
      });
      mostrar('ok', `¡Listo, ${nombre}! Tu clase quedó reservada: ${fechaLarga(r.fecha)} de ${r.hora} a ${r.fin}.`);
      estado.hora = null;
      $('#notas').value = '';
      await cargarDisponibilidad();
    } catch (e) {
      mostrar('error', e.message);
      if (e.status === 409) { estado.hora = null; await cargarDisponibilidad(); }
    } finally {
      btn.textContent = 'Reservar clase';
      actualizarResumen();
    }
  });

  (async function iniciar() {
    try {
      estado.cfg = await pedir('/api/config');
      estado.ahora = estado.cfg.ahora;
      const f = $('#fecha');
      f.min = estado.ahora.fecha;
      f.value = estado.ahora.fecha;
      pintarDuraciones();
      await cargarDisponibilidad();
    } catch (e) {
      mostrar('error', 'No se pudo cargar la información. Recarga la página.');
    }
  })();
})();
</script>
</body>
</html>
